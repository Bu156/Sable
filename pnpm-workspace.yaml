allowBuilds:
  '@sableclient/tauri-plugin-notifications-api': true
  '@sentry/cli': true
  '@swc/core': true
  cloudflared: set this to true or false
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true
  workerd: set this to true or false
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'matrix-js-sdk'
  - '@sableclient/sable-call-embedded'
  - '@sableclient/twemoji-font'

peerDependencyRules:
  allowedVersions:
    'folds>@vanilla-extract/css': '1.21.2'
    'folds>@vanilla-extract/recipes': '0.5.7'
    'folds>classnames': '2.5.1'
    'folds>react': '19.2.8'
    'folds>react-dom': '19.2.8'
