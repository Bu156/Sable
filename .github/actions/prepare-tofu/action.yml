name: Prepare OpenTofu Deployment
description: Prepares OpenTofu in infra/web.

inputs:
  build-flavor:
    description: Build flavor (stable or dev). Controls app build behavior.
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Setup app and build
      uses: ./.github/actions/setup
      with:
        build: 'true'
      env:
        SABLE_BUILD_FLAVOR: ${{ inputs.build-flavor }}
        VITE_SENTRY_DSN: ${{ env.VITE_SENTRY_DSN }}
        VITE_SENTRY_ENVIRONMENT: ${{ env.VITE_SENTRY_ENVIRONMENT }}
        VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
        SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ env.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}

    - name: Setup OpenTofu via mise
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

    - name: Check formatting
      shell: bash
      working-directory: ${{ github.workspace }}/infra/web
      run: mise exec opentofu@1.11.5 -- tofu fmt -check

    - name: Initialize OpenTofu
      shell: bash
      working-directory: ${{ github.workspace }}/infra/web
      run: mise exec opentofu@1.11.5 -- tofu init -input=false -reconfigure

    - name: Validate configuration
      shell: bash
      working-directory: ${{ github.workspace }}/infra/web
      run: mise exec opentofu@1.11.5 -- tofu validate -no-color
