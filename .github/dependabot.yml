# Docs: <https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/customizing-dependency-updates>

version: 2
updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      npm-major:
        update-types:
          - major
      npm-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    cooldown:
      default-days: 7
    directory: /src-tauri
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - internal
    commit-message:
      prefix: chore
    groups:
      # tauri core + build + plugins are version-coupled; bump together so a
      # core major bump lands with matching plugin updates in the same PR
      # rather than as broken intermediate states.
      tauri-family:
        patterns:
          - tauri
          - tauri-build
          - tauri-plugin-*
      cargo-major:
        update-types:
          - major
      cargo-non-major:
        update-types:
          - minor
          - patch
