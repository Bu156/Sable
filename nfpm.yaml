# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json

name: sable
arch: amd64
platform: linux
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
version_schema: semver
section: net
maintainer: SableClient
description: Sable, a Matrix client
homepage: https://sable.moe
license: AGPL-3.0-or-later

contents:
  - src: ${PKGROOT}/opt/sable/
    dst: /opt/sable
    type: tree
    expand: true
  - src: ${PKGROOT}/usr/
    dst: /usr
    type: tree
    expand: true

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libnss3
      - libnspr4
      - libgbm1
      - libdrm2
      - libxkbcommon0
      - libasound2
      - libcups2
      - xdg-utils
      - xwayland
      - libayatana-appindicator3-1
  rpm:
    depends:
      - gtk3
      - nss
      - nspr
      - mesa-libgbm
      - libdrm
      - libxkbcommon
      - alsa-lib
      - cups-libs
      - xdg-utils
      - xorg-x11-server-Xwayland
      - libayatana-appindicator3.so.1()(64bit)
  apk:
    depends:
      - webkit2gtk-4.1
      - gtk+3.0
      - libayatana-appindicator
      - librsvg
      - xdotool
      - mesa-gbm
      - libdrm
      - libxkbcommon
      - alsa-lib
      - cups
      - xdg-utils
      - libxcomposite
      - ttf-freefont
  archlinux:
    depends:
      - webkit2gtk-4.1
      - gtk3
      - libayatana-appindicator
      - librsvg
      - xdotool
      - hicolor-icon-theme
      - desktop-file-utils
  ipk:
    depends:
      - webkit2gtk-4.1
      - gtk3
      - libayatana-appindicator3
      - librsvg
      - xdotool
